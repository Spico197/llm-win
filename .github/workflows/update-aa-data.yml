name: Update Artificial Analysis Data

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:update
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
      - run: npm run data:analyze-unreachable
      - run: npm run data:report
      - run: npm test
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Artificial Analysis data"
          file_pattern: "public/data/*.json"
      - run: npm run build
        env:
          VITE_GA_ID: ${{ vars.VITE_GA_ID }}
          VITE_BAIDU_TONGJI_ID: ${{ vars.VITE_BAIDU_TONGJI_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
